name: determine-workflow-conclusion
description: |
  A GitHub Action for determining the workflow conclusion for a running workflow.
author: jmpa-io
outputs:
  conclusion:
    description: |
      The overall conclusion for the workflow run: 'success', 'failure', or 'cancelled'.
runs:
  using: docker
  image: Dockerfile
inputs:
  token:
    description: |
      A GitHub personal access token; used to determine the workflow conclusion via the GitHub API.
    required: true
